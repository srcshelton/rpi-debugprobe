name: Build custom firmware
run-name: Build ${{ github.ref_name }}

on:
  push:
    tags:
      - "remote-upgrade-v*"

permissions:
  contents: write

env:
  PICO_SDK_VERSION: "2.3.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build UF2
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Derive release metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]] ||
             [[ ! "${release_tag}" =~ ^remote-upgrade-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "::error::Unsupported release tag ${release_tag}"
            exit 1
          fi

          release_version="${release_tag#remote-upgrade-}"
          source_commit="$(git rev-parse HEAD)"
          base_tag="$(git tag --merged HEAD --sort=-v:refname --list 'debugprobe-v*' | head -n 1)"
          if [[ -n "${base_tag}" ]]; then
            source_base="${base_tag}"
          else
            release_subject="$(git log --format=%s --grep='^Debugprobe v[0-9]' -n 1)"
            if [[ -n "${release_subject}" ]]; then
              source_base="${release_subject}"
            else
              source_base="HEAD"
            fi
          fi

          artifact_stem="debugprobe-${release_version}-remote-upgrade"

          {
            echo "release_version=${release_version}"
            echo "source_base=${source_base}"
            echo "source_commit=${source_commit}"
            echo "artifact_stem=${artifact_stem}"
            echo "release_tag=${release_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Ensure Release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists"
            exit 1
          fi

      - name: Check out Pico SDK
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          path: pico-sdk
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            gcc-arm-none-eabi \
            git \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            make \
            python3

      - name: Configure firmware
        run: |
          cmake -S . -B build \
            -DPICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk" \
            -DDEBUGPROBE_ENABLE_BOOTSEL_BAUD_KNOCK=ON

      - name: Build firmware
        run: cmake --build build --parallel

      - name: Package UF2
        run: |
          mkdir -p dist
          cp build/debugprobe.uf2 "dist/${{ steps.version.outputs.artifact_stem }}.uf2"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_stem }}
          path: dist/*.uf2
          if-no-files-found: error

      - name: Write release notes
        run: |
          cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          Automated custom firmware build for Raspberry Pi Debug Probe ${{ steps.version.outputs.release_version }}.

          Source tag: ${{ steps.version.outputs.release_tag }}
          Source base: ${{ steps.version.outputs.source_base }}
          Source commit: ${{ steps.version.outputs.source_commit }}
          Pico SDK: ${{ env.PICO_SDK_VERSION }}
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Build options:
          - DEBUGPROBE_ENABLE_BOOTSEL_BAUD_KNOCK=ON
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_TITLE: Debug Probe ${{ steps.version.outputs.release_version }} remote-upgrade firmware
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
        run: |
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if [[ "${tag_commit}" != "${SOURCE_COMMIT}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} resolves to ${tag_commit}, expected ${SOURCE_COMMIT}"
            exit 1
          fi

          gh release create "${RELEASE_TAG}" dist/*.uf2 \
            --verify-tag \
            --target "${SOURCE_COMMIT}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
